# SPDX-License-Identifier: MIT
# Dependency trial (mitcad_private#281): MitCad's third-party dependencies built on
# GitHub's free standard runners as a matrix of port groups x platform, level after
# level (a level's jobs need the previous level's), each job's vcpkg packages handed
# on as artifacts (vcpkg's files binary source); then per platform the render
# prefix, and the app build and its tests sharded over parallel jobs from those
# packages. Cold: no GitHub cache is read. Generated by a local helper.
name: trial-deps-flat
on:
  push:
    branches: [trial-deps]
    paths: ['.github/trial/run-deps-flat']
defaults:
  run:
    shell: bash
env:
  MITCAD_RENDER_JOBS: "4"
  NVCC_APPEND_FLAGS: "-allow-unsupported-compiler"
permissions: { actions: read, contents: read }
jobs:
  plan_lx:
    name: plan linux-x64
    runs-on: ubuntu-24.04
    env: { TRIAL_PLATFORM: linux-x64 }
    outputs:
      l0: ${{ steps.plan.outputs.l0 }}
      l1: ${{ steps.plan.outputs.l1 }}
      l2: ${{ steps.plan.outputs.l2 }}
      l3: ${{ steps.plan.outputs.l3 }}
      l4: ${{ steps.plan.outputs.l4 }}
      l5: ${{ steps.plan.outputs.l5 }}
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg and its toolchain
        run: bash .github/trial/deps-tools.sh
      - name: Start the watcher
        run: |
          mkdir -p "$RUNNER_TEMP/trial"
          if [ "$TRIAL_PLATFORM" = windows-x64 ]; then
            pwsh -NoProfile -Command "Start-Process powershell -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','$(cygpath -w "$PWD/.github/trial/watch.ps1")','-Drive','$(echo "$TRIAL_R" | cut -c1)')"
          else
            nohup bash .github/trial/watch.sh "$HOME" > /dev/null 2>&1 < /dev/null &
          fi
          echo "cores $(nproc 2> /dev/null || sysctl -n hw.ncpu)"; date -u
      - name: Plan
        id: plan
        run: |
          mkdir -p plan
          "$VCPKG_EXE" install --dry-run --x-manifest-root="$REPO" --x-install-root="$TRIAL_R/inst" --overlay-triplets="$REPO/triplets" --triplet x64-linux-dynamic --host-triplet x64-linux > plan/dry-run.txt 2>&1 || { cat plan/dry-run.txt; exit 1; }
          "$VCPKG_EXE" depend-info --x-manifest-root="$REPO" --format=list --show-depth --overlay-triplets="$REPO/triplets" --triplet x64-linux-dynamic --host-triplet x64-linux > plan/depend-info.txt 2>&1 || { cat plan/depend-info.txt; exit 1; }
          $PY .github/trial/deps-plan.py plan/dry-run.txt plan/depend-info.txt x64-linux-dynamic 6 flat
  l0_lx:
    name: L0 linux-x64 ${{ matrix.name }}
    needs: [plan_lx]
    if: ${{ !cancelled() && needs.plan_lx.result == 'success' && needs.plan_lx.outputs.l0 != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env: { TRIAL_PLATFORM: linux-x64 }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan_lx.outputs.l0) }}
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg and its toolchain
        run: bash .github/trial/deps-tools.sh
      - name: Start the watcher
        run: |
          mkdir -p "$RUNNER_TEMP/trial"
          if [ "$TRIAL_PLATFORM" = windows-x64 ]; then
            pwsh -NoProfile -Command "Start-Process powershell -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','$(cygpath -w "$PWD/.github/trial/watch.ps1")','-Drive','$(echo "$TRIAL_R" | cut -c1)')"
          else
            nohup bash .github/trial/watch.sh "$HOME" > /dev/null 2>&1 < /dev/null &
          fi
          echo "cores $(nproc 2> /dev/null || sysctl -n hw.ncpu)"; date -u
      - name: vcpkg install ${{ matrix.specs }}
        run: |
          $PY .github/trial/deps-manifest.py "$REPO" "$TRIAL_R/m" "${{ matrix.all }}" > /dev/null
          mkdir -p "$BINCACHE"; find "$BINCACHE" -type f | sort > "$RUNNER_TEMP/before"
          echo "TRIAL| cache in | $(wc -l < "$RUNNER_TEMP/before" | tr -d ' ') packages"
          t0=$(date +%s)
          "$VCPKG_EXE" install --x-manifest-root="$TRIAL_R/m" --x-install-root="$TRIAL_R/inst" --overlay-triplets="$REPO/triplets" --triplet x64-linux-dynamic --host-triplet x64-linux --no-print-usage --clean-after-build > "$RUNNER_TEMP/vcpkg.log" 2>&1 || { tail -60 "$RUNNER_TEMP/vcpkg.log"; for f in "$VCPKG_ROOT"/buildtrees/*/*-err.log "$VCPKG_ROOT"/buildtrees/*/*-out.log; do [ -s "$f" ] && { echo "== $f"; tail -40 "$f"; }; done; exit 1; }
          echo "TRIAL| install | $(( $(date +%s) - t0 )) s"
          grep -E "^(Restored|Elapsed|Total install)|^Installing|^Building|Restored [0-9]+ package" "$RUNNER_TEMP/vcpkg.log" | tail -80 || true
          find "$BINCACHE" -type f | sort > "$RUNNER_TEMP/after"
          comm -13 "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" > "$RUNNER_TEMP/new"
          mkdir -p "$TRIAL_R/new"
          while read -r f; do rel=${f#"$BINCACHE"/}; mkdir -p "$TRIAL_R/new/$(dirname "$rel")"; cp "$f" "$TRIAL_R/new/$rel"; done < "$RUNNER_TEMP/new"
          echo "TRIAL| new binary packages | $(wc -l < "$RUNNER_TEMP/new" | tr -d ' ')"
      - uses: actions/upload-artifact@v4
        with: { name: "bc-lx-l0-${{ matrix.name }}", path: "${{ env.TRIAL_R }}/new", if-no-files-found: ignore, retention-days: 3, compression-level: 0 }
      - name: Peaks
        if: always()
        run: |
          echo "TRIAL| peaks | mem $(cat "$RUNNER_TEMP/trial/mempeak" 2> /dev/null || echo ?) MiB | disk used $(( $(cat "$RUNNER_TEMP/trial/diskpeak" 2> /dev/null || echo 0) / 1024 )) GiB"
          df -h "$TRIAL_R" 2> /dev/null | tail -1 || true
  l1_lx:
