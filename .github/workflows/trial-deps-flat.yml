  deps_wx:
    name: deps+render windows-x64
    needs: [plan_wx, l0_wx, l1_wx, l2_wx, l3_wx, l4_wx, l5_wx]
    if: ${{ !cancelled() && needs.plan_wx.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 360
    env: { TRIAL_PLATFORM: windows-x64 }
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: vcpkg and its toolchain
        run: bash .github/trial/deps-tools.sh
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Start the watcher
        run: |
          mkdir -p "$RUNNER_TEMP/trial"
          if [ "$TRIAL_PLATFORM" = windows-x64 ]; then
            pwsh -NoProfile -Command "Start-Process powershell -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','$(cygpath -w "$PWD/.github/trial/watch.ps1")','-Drive','$(echo "$TRIAL_R" | cut -c1)')"
          else
            nohup bash .github/trial/watch.sh "$HOME" > /dev/null 2>&1 < /dev/null &
          fi
          echo "cores $(nproc 2> /dev/null || sysctl -n hw.ncpu)"; date -u
      - uses: actions/download-artifact@v4
        with: { pattern: "bc-wx-*", merge-multiple: true, path: "${{ env.BINCACHE }}" }
      - name: The whole manifest from the cache (into the render prefix)
        run: |
          mkdir -p "$BINCACHE"; find "$BINCACHE" -type f | sort > "$RUNNER_TEMP/before"
          echo "TRIAL| cache in | $(wc -l < "$RUNNER_TEMP/before" | tr -d ' ') packages"
          t0=$(date +%s)
          "$VCPKG_EXE" install --x-manifest-root="$REPO" --x-install-root="$TRIAL_R/rd/vcpkg_installed" --overlay-triplets="$REPO/triplets" --triplet x64-windows --host-triplet x64-windows --no-print-usage --clean-after-build > "$RUNNER_TEMP/vcpkg.log" 2>&1 || { tail -60 "$RUNNER_TEMP/vcpkg.log"; for f in "$VCPKG_ROOT"/buildtrees/*/*-err.log "$VCPKG_ROOT"/buildtrees/*/*-out.log; do [ -s "$f" ] && { echo "== $f"; tail -40 "$f"; }; done; exit 1; }
          echo "TRIAL| assemble | $(( $(date +%s) - t0 )) s"
          grep -E "Restored [0-9]+ package|^Building|^Installing|Total install" "$RUNNER_TEMP/vcpkg.log" | tail -60 || true
          find "$BINCACHE" -type f | sort > "$RUNNER_TEMP/after"
          comm -13 "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" > "$RUNNER_TEMP/new"
          mkdir -p "$TRIAL_R/new"
          while read -r f; do rel=${f#"$BINCACHE"/}; mkdir -p "$TRIAL_R/new/$(dirname "$rel")"; cp "$f" "$TRIAL_R/new/$rel"; done < "$RUNNER_TEMP/new"
          echo "TRIAL| new binary packages | $(wc -l < "$RUNNER_TEMP/new" | tr -d ' ')"
      - uses: actions/upload-artifact@v4
        with: { name: "bc-wx-assemble", path: "${{ env.TRIAL_R }}/new", if-no-files-found: ignore, retention-days: 3, compression-level: 0 }
      - name: Render prefix (OIDN, Cycles with CUDA; VS 2022)
        shell: pwsh
        env: { MITCAD_RENDER_REQUIRED_DEVICES: "CPU;CUDA" }
        run: |
          $env:MITCAD_RENDER_DEPS = "$env:TRIAL_R/rd"
          $t0 = Get-Date
          & .github/trial/render.ps1
          "TRIAL| render | $([int]((Get-Date) - $t0).TotalSeconds) s"
      - name: Pack the render prefix
        run: |
          $PY .github/trial/pack.py pack "$TRIAL_R/rd" "$TRIAL_R/render.tar" downloads vcpkg_installed build/oidn 'build/*/CMakeFiles' '*.o' '*.obj' '*.pdb' '*.ilk' 'src/oidn*' 'src/ispc*' '*.log'
      - uses: actions/upload-artifact@v4
        with: { name: "render-wx", path: "${{ env.TRIAL_R }}/render.tar", retention-days: 3, compression-level: 1 }
      - name: Peaks
        if: always()
        run: |
          echo "TRIAL| peaks | mem $(cat "$RUNNER_TEMP/trial/mempeak" 2> /dev/null || echo ?) MiB | disk used $(( $(cat "$RUNNER_TEMP/trial/diskpeak" 2> /dev/null || echo 0) / 1024 )) GiB"
          df -h "$TRIAL_R" 2> /dev/null | tail -1 || true
