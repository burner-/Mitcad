# SPDX-License-Identifier: MIT
# Dependency trial (mitcad_private#281): MitCad's third-party dependencies built on
# GitHub's free standard runners as a matrix of port groups x platform, level after
# level (a level's jobs need the previous level's), each job's vcpkg packages handed
# on as artifacts (vcpkg's files binary source); then per platform the render
# prefix, and the app build and its tests sharded over parallel jobs from those
# packages. Cold: no GitHub cache is read. Generated by a local helper.
name: trial-app
on:
  push:
    branches: [trial-deps]
    paths: ['.github/trial/run-app']
defaults:
  run:
    shell: bash
env:
  MITCAD_RENDER_JOBS: "4"
  NVCC_APPEND_FLAGS: "-allow-unsupported-compiler"
permissions: { actions: read, contents: read }
jobs:
  build_la:
    name: build linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env: { TRIAL_PLATFORM: linux-arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg and its toolchain
        run: bash .github/trial/deps-tools.sh
      - name: Start the watcher
        run: |
          mkdir -p "$RUNNER_TEMP/trial"
          if [ "$TRIAL_PLATFORM" = windows-x64 ]; then
            pwsh -NoProfile -Command "Start-Process powershell -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','$(cygpath -w "$PWD/.github/trial/watch.ps1")','-Drive','$(echo "$TRIAL_R" | cut -c1)')"
          else
            nohup bash .github/trial/watch.sh "$HOME" > /dev/null 2>&1 < /dev/null &
          fi
          echo "cores $(nproc 2> /dev/null || sysctl -n hw.ncpu)"; date -u
      - name: App toolchain (packages, Rust, Qt, CEF)
        run: bash .github/trial/app-tools.sh
      - uses: actions/download-artifact@v4
        with: { pattern: "bc-la-*", merge-multiple: true, path: "${{ env.BINCACHE }}", run-id: 45181497279, github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/download-artifact@v4
        with: { name: "render-la", path: "${{ env.TRIAL_R }}/dl-render", run-id: 45181497279, github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Render prefix and vcpkg packages from the artifacts
        run: |
          t0=$(date +%s)
          (cd "$TRIAL_R" && $PY "$REPO/.github/trial/pack.py" unpack "$TRIAL_R/dl-render/render.tar") && rm -rf "$TRIAL_R/dl-render"
          "$VCPKG_EXE" install --x-manifest-root="$REPO" --x-install-root="$TRIAL_R/rd/vcpkg_installed" --overlay-triplets="$REPO/triplets" --triplet arm64-linux-dynamic --host-triplet arm64-linux --no-print-usage > "$RUNNER_TEMP/vcpkg.log" 2>&1 || { tail -60 "$RUNNER_TEMP/vcpkg.log"; for f in "$VCPKG_ROOT"/buildtrees/*/*-err.log "$VCPKG_ROOT"/buildtrees/*/*-out.log; do [ -s "$f" ] && { echo "== $f"; tail -40 "$f"; }; done; exit 1; }
          grep -E "Restored [0-9]+ package|^Building" "$RUNNER_TEMP/vcpkg.log" | tail -20 || true
          echo "TRIAL| deps from artifacts | $(( $(date +%s) - t0 )) s"
      - name: Configure
        run: |
          t0=$(date +%s)
          cmake --preset linux-release -B "$TRIAL_R/b" -DMITCAD_UPDATE_TEST_HOOKS=OFF -DVCPKG_TARGET_TRIPLET=arm64-linux-dynamic -DPROJECT_ARCH=arm64
          echo "TRIAL| configure | $(( $(date +%s) - t0 )) s"
      - name: Build
        run: |
          t0=$(date +%s)
          cmake --build "$TRIAL_R/b" 2>&1 | tail -n 200
          test "${PIPESTATUS[0]}" = 0
          echo "TRIAL| build | $(( $(date +%s) - t0 )) s"
      - name: Where the build time went
        if: always()
        run: $PY .github/trial/ninja-stats.py "$TRIAL_R/b" || true
      - name: Tests registered
        run: |
          ctest --test-dir "$TRIAL_R/b" -N > "$RUNNER_TEMP/tests.txt"
          echo "TRIAL| tests | all $(grep -c 'Test *#' "$RUNNER_TEMP/tests.txt") | ui $(grep 'Test *#' "$RUNNER_TEMP/tests.txt" | grep -c 'ui-') | core $(grep 'Test *#' "$RUNNER_TEMP/tests.txt" | grep -c ': core\.')"
      - name: Pack the build tree for the test jobs
        run: |
          $PY .github/trial/pack.py pack "$TRIAL_R/b" "$TRIAL_R/tree.tar" '*.o' '*.obj' '*.pdb' '*.ilk' '*.rlib' '*.rmeta' '*.d' 'incremental' '.fingerprint' 'cargo/*/deps' 'cargo/*/*/deps' 'cargo/*/build' 'cargo/*/*/build' 'vcpkg_installed/*/debug' 'vcpkg_installed/vcpkg/blds' 'CMakeFiles/*.dir'
      - uses: actions/upload-artifact@v4
        with: { name: "tree-la", path: "${{ env.TRIAL_R }}/tree.tar", retention-days: 2, compression-level: 1 }
      - name: Peaks
        if: always()
        run: |
          echo "TRIAL| peaks | mem $(cat "$RUNNER_TEMP/trial/mempeak" 2> /dev/null || echo ?) MiB | disk used $(( $(cat "$RUNNER_TEMP/trial/diskpeak" 2> /dev/null || echo 0) / 1024 )) GiB"
          df -h "$TRIAL_R" 2> /dev/null | tail -1 || true
  test_la:
    name: test linux-arm64 ${{ matrix.kind }} ${{ matrix.k }}/${{ matrix.n }}
    needs: [build_la]
    if: ${{ !cancelled() && needs.build_la.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env: { TRIAL_PLATFORM: linux-arm64 }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: core, k: 1, n: 1 }
          - { kind: nonui, k: 1, n: 6 }
          - { kind: nonui, k: 2, n: 6 }
          - { kind: nonui, k: 3, n: 6 }
          - { kind: nonui, k: 4, n: 6 }
          - { kind: nonui, k: 5, n: 6 }
          - { kind: nonui, k: 6, n: 6 }
          - { kind: ui, k: 1, n: 4 }
          - { kind: ui, k: 2, n: 4 }
          - { kind: ui, k: 3, n: 4 }
          - { kind: ui, k: 4, n: 4 }
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg and its toolchain
        run: bash .github/trial/deps-tools.sh
      - name: Start the watcher
        run: |
          mkdir -p "$RUNNER_TEMP/trial"
          if [ "$TRIAL_PLATFORM" = windows-x64 ]; then
            pwsh -NoProfile -Command "Start-Process powershell -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','$(cygpath -w "$PWD/.github/trial/watch.ps1")','-Drive','$(echo "$TRIAL_R" | cut -c1)')"
          else
            nohup bash .github/trial/watch.sh "$HOME" > /dev/null 2>&1 < /dev/null &
          fi
          echo "cores $(nproc 2> /dev/null || sysctl -n hw.ncpu)"; date -u
      - name: App toolchain (packages, Rust, Qt, CEF)
        run: bash .github/trial/app-tools.sh
      - uses: actions/download-artifact@v4
        with: { name: "render-la", path: "${{ env.TRIAL_R }}/dl-render", run-id: 45181497279, github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/download-artifact@v4
        with: { name: "tree-la", path: "${{ env.TRIAL_R }}/dl-tree" }
      - name: Unpack
        run: |
          t0=$(date +%s)
          cd "$TRIAL_R"
          $PY "$REPO/.github/trial/pack.py" unpack dl-render/render.tar && rm -rf dl-render
          $PY "$REPO/.github/trial/pack.py" unpack dl-tree/tree.tar && rm -rf dl-tree
          echo "TRIAL| unpack | $(( $(date +%s) - t0 )) s"
      - name: Tests ${{ matrix.kind }} ${{ matrix.k }}/${{ matrix.n }}
        run: |
          case "${{ matrix.kind }}" in
            core) sel=(-R '^core\.' -j 4) ;;
            nonui) sel=(-E 'ui-|^core\.' -I "${{ matrix.k }},,${{ matrix.n }}" -j 4) ;;
            ui) sel=(-R 'ui-' -I "${{ matrix.k }},,${{ matrix.n }}" -j 2) ;;
          esac
          t0=$(date +%s)
          ctest --test-dir "$TRIAL_R/b" "${sel[@]}" --timeout 900 --output-on-failure > "$RUNNER_TEMP/ctest.log" 2>&1 || true
          echo "TRIAL| tests ${{ matrix.kind }} ${{ matrix.k }}/${{ matrix.n }} | $(( $(date +%s) - t0 )) s"
          grep -E 'tests passed|Total Test time|\*\*\*Failed|\*\*\*Timeout|Not Run|\*\*\*Exception' "$RUNNER_TEMP/ctest.log" | tail -60 || true
          sed -n '/The following tests FAILED/,$p' "$RUNNER_TEMP/ctest.log" | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "ctest-la-${{ matrix.kind }}-${{ matrix.k }}", path: "${{ runner.temp }}/ctest.log", retention-days: 3 }
      - name: Peaks
        if: always()
        run: |
          echo "TRIAL| peaks | mem $(cat "$RUNNER_TEMP/trial/mempeak" 2> /dev/null || echo ?) MiB | disk used $(( $(cat "$RUNNER_TEMP/trial/diskpeak" 2> /dev/null || echo 0) / 1024 )) GiB"
          df -h "$TRIAL_R" 2> /dev/null | tail -1 || true
