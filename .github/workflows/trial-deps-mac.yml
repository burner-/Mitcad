    steps:
      - uses: actions/checkout@v4
      - name: vcpkg and its toolchain
        run: bash .github/trial/deps-tools.sh
      - name: Start the watcher
        run: |
          mkdir -p "$RUNNER_TEMP/trial"
          if [ "$TRIAL_PLATFORM" = windows-x64 ]; then
            pwsh -NoProfile -Command "Start-Process powershell -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','$(cygpath -w "$PWD/.github/trial/watch.ps1")','-Drive','$(echo "$TRIAL_R" | cut -c1)')"
          else
            nohup bash .github/trial/watch.sh "$HOME" > /dev/null 2>&1 < /dev/null &
          fi
          echo "cores $(nproc 2> /dev/null || sysctl -n hw.ncpu)"; date -u
      - uses: actions/download-artifact@v4
        with: { pattern: "bc-ma-*", merge-multiple: true, path: "${{ env.BINCACHE }}" }
      - name: The whole manifest from the cache (into the render prefix)
        run: |
          mkdir -p "$BINCACHE"; find "$BINCACHE" -type f | sort > "$RUNNER_TEMP/before"
          echo "TRIAL| cache in | $(wc -l < "$RUNNER_TEMP/before" | tr -d ' ') packages"
          t0=$(date +%s)
          "$VCPKG_EXE" install --x-manifest-root="$REPO" --x-install-root="$TRIAL_R/rd/vcpkg_installed" --overlay-triplets="$REPO/triplets" --triplet arm64-osx-dynamic --host-triplet arm64-osx --no-print-usage --clean-after-build > "$RUNNER_TEMP/vcpkg.log" 2>&1 || { tail -60 "$RUNNER_TEMP/vcpkg.log"; for f in "$VCPKG_ROOT"/buildtrees/*/*-err.log "$VCPKG_ROOT"/buildtrees/*/*-out.log; do [ -s "$f" ] && { echo "== $f"; tail -40 "$f"; }; done; exit 1; }
          echo "TRIAL| assemble | $(( $(date +%s) - t0 )) s"
          grep -E "Restored [0-9]+ package|^Building|^Installing|Total install" "$RUNNER_TEMP/vcpkg.log" | tail -60 || true
          find "$BINCACHE" -type f | sort > "$RUNNER_TEMP/after"
          comm -13 "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" > "$RUNNER_TEMP/new"
          mkdir -p "$TRIAL_R/new"
          while read -r f; do rel=${f#"$BINCACHE"/}; mkdir -p "$TRIAL_R/new/$(dirname "$rel")"; cp "$f" "$TRIAL_R/new/$rel"; done < "$RUNNER_TEMP/new"
          echo "TRIAL| new binary packages | $(wc -l < "$RUNNER_TEMP/new" | tr -d ' ')"
      - uses: actions/upload-artifact@v4
        with: { name: "bc-ma-assemble", path: "${{ env.TRIAL_R }}/new", if-no-files-found: ignore, retention-days: 3, compression-level: 0 }
      - name: Render prefix (OIDN, Cycles)
        run: |
          t0=$(date +%s)
          bash .github/trial/render.sh
          echo "TRIAL| render | $(( $(date +%s) - t0 )) s"
      - name: Pack the render prefix
        run: |
          $PY .github/trial/pack.py pack "$TRIAL_R/rd" "$TRIAL_R/render.tar" downloads vcpkg_installed build/oidn 'build/*/CMakeFiles' '*.o' '*.obj' '*.pdb' '*.ilk' 'src/oidn*' 'src/ispc*' '*.log'
      - uses: actions/upload-artifact@v4
        with: { name: "render-ma", path: "${{ env.TRIAL_R }}/render.tar", retention-days: 3, compression-level: 1 }
      - name: Peaks
        if: always()
        run: |
          echo "TRIAL| peaks | mem $(cat "$RUNNER_TEMP/trial/mempeak" 2> /dev/null || echo ?) MiB | disk used $(( $(cat "$RUNNER_TEMP/trial/diskpeak" 2> /dev/null || echo 0) / 1024 )) GiB"
          df -h "$TRIAL_R" 2> /dev/null | tail -1 || true
  rust_ma:
    name: rust macos-arm64
    runs-on: macos-latest
    timeout-minutes: 240
    env: { TRIAL_PLATFORM: macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Rust core library (the crates CMake imports), release
        run: |
          RUST=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          command -v rustup > /dev/null || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none; . "$HOME/.cargo/env"; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
          t0=$(date +%s)
          rustup toolchain install "$RUST" --profile minimal --no-self-update > /dev/null
          echo "TRIAL| rust toolchain | $(( $(date +%s) - t0 )) s"
          t0=$(date +%s)
          cargo build --release --manifest-path core/Cargo.toml -p mitcad-ffi -p mitcad-update -p mitcad-testrun -p mitcad-thumbnailer -p mitcad-thumbnailer-capi 2>&1 | tail -5
          test "${PIPESTATUS[0]}" = 0
          echo "TRIAL| rust core library (release) | $(( $(date +%s) - t0 )) s"
      - name: Rust tests built (debug, as core.cargo_build)
        run: |
          t0=$(date +%s)
          cargo test --no-run --workspace --manifest-path core/Cargo.toml 2>&1 | tail -5
          echo "TRIAL| rust tests built (debug) | $(( $(date +%s) - t0 )) s exit ${PIPESTATUS[0]}"
  build_ma:
    name: build macos-arm64
    needs: [deps_ma]
    runs-on: macos-latest
    timeout-minutes: 360
    env: { TRIAL_PLATFORM: macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg and its toolchain
        run: bash .github/trial/deps-tools.sh
      - name: Start the watcher
        run: |
          mkdir -p "$RUNNER_TEMP/trial"
          if [ "$TRIAL_PLATFORM" = windows-x64 ]; then
            pwsh -NoProfile -Command "Start-Process powershell -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','$(cygpath -w "$PWD/.github/trial/watch.ps1")','-Drive','$(echo "$TRIAL_R" | cut -c1)')"
          else
            nohup bash .github/trial/watch.sh "$HOME" > /dev/null 2>&1 < /dev/null &
          fi
          echo "cores $(nproc 2> /dev/null || sysctl -n hw.ncpu)"; date -u
      - name: App toolchain (packages, Rust, Qt, CEF)
        run: bash .github/trial/app-tools.sh
      - uses: actions/download-artifact@v4
        with: { pattern: "bc-ma-*", merge-multiple: true, path: "${{ env.BINCACHE }}" }
      - uses: actions/download-artifact@v4
        with: { name: "render-ma", path: "${{ env.TRIAL_R }}/dl-render" }
      - name: Render prefix and vcpkg packages from the artifacts
        run: |
          t0=$(date +%s)
          (cd "$TRIAL_R" && $PY "$REPO/.github/trial/pack.py" unpack "$TRIAL_R/dl-render/render.tar") && rm -rf "$TRIAL_R/dl-render"
          "$VCPKG_EXE" install --x-manifest-root="$REPO" --x-install-root="$TRIAL_R/rd/vcpkg_installed" --overlay-triplets="$REPO/triplets" --triplet arm64-osx-dynamic --host-triplet arm64-osx --no-print-usage > "$RUNNER_TEMP/vcpkg.log" 2>&1 || { tail -60 "$RUNNER_TEMP/vcpkg.log"; for f in "$VCPKG_ROOT"/buildtrees/*/*-err.log "$VCPKG_ROOT"/buildtrees/*/*-out.log; do [ -s "$f" ] && { echo "== $f"; tail -40 "$f"; }; done; exit 1; }
          grep -E "Restored [0-9]+ package|^Building" "$RUNNER_TEMP/vcpkg.log" | tail -20 || true
          echo "TRIAL| deps from artifacts | $(( $(date +%s) - t0 )) s"
      - name: Configure
        run: |
          t0=$(date +%s)
          cmake --preset macos-release -B "$TRIAL_R/b" -DMITCAD_UPDATE_TEST_HOOKS=OFF
          echo "TRIAL| configure | $(( $(date +%s) - t0 )) s"
      - name: Build
        run: |
          t0=$(date +%s)
          cmake --build "$TRIAL_R/b" 2>&1 | tail -n 200
          test "${PIPESTATUS[0]}" = 0
          echo "TRIAL| build | $(( $(date +%s) - t0 )) s"
      - name: Where the build time went
        if: always()
        run: $PY .github/trial/ninja-stats.py "$TRIAL_R/b" || true
      - name: Tests registered
        run: |
          ctest --test-dir "$TRIAL_R/b" -N > "$RUNNER_TEMP/tests.txt"
          echo "TRIAL| tests | all $(grep -c 'Test *#' "$RUNNER_TEMP/tests.txt") | ui $(grep 'Test *#' "$RUNNER_TEMP/tests.txt" | grep -c 'ui-') | core $(grep 'Test *#' "$RUNNER_TEMP/tests.txt" | grep -c ': core\.')"
      - name: Pack the build tree for the test jobs
        run: |
          $PY .github/trial/pack.py pack "$TRIAL_R/b" "$TRIAL_R/tree.tar" '*.o' '*.obj' '*.pdb' '*.ilk' '*.rlib' '*.rmeta' '*.d' 'incremental' '.fingerprint' 'cargo/*/deps' 'cargo/*/*/deps' 'cargo/*/build' 'cargo/*/*/build' 'vcpkg_installed/*/debug' 'vcpkg_installed/vcpkg/blds' 'CMakeFiles/*.dir'
      - uses: actions/upload-artifact@v4
        with: { name: "tree-ma", path: "${{ env.TRIAL_R }}/tree.tar", retention-days: 2, compression-level: 1 }
      - name: Peaks
        if: always()
        run: |
          echo "TRIAL| peaks | mem $(cat "$RUNNER_TEMP/trial/mempeak" 2> /dev/null || echo ?) MiB | disk used $(( $(cat "$RUNNER_TEMP/trial/diskpeak" 2> /dev/null || echo 0) / 1024 )) GiB"
          df -h "$TRIAL_R" 2> /dev/null | tail -1 || true
  test_ma:
    name: test macos-arm64 ${{ matrix.kind }} ${{ matrix.k }}/${{ matrix.n }}
    needs: [build_ma]
    runs-on: macos-latest
    timeout-minutes: 180
    env: { TRIAL_PLATFORM: macos-arm64 }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: core, k: 1, n: 1 }
          - { kind: nonui, k: 1, n: 3 }
          - { kind: nonui, k: 2, n: 3 }
          - { kind: nonui, k: 3, n: 3 }
          - { kind: ui, k: 1, n: 1 }
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg and its toolchain
        run: bash .github/trial/deps-tools.sh
      - name: Start the watcher
        run: |
          mkdir -p "$RUNNER_TEMP/trial"
          if [ "$TRIAL_PLATFORM" = windows-x64 ]; then
            pwsh -NoProfile -Command "Start-Process powershell -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','$(cygpath -w "$PWD/.github/trial/watch.ps1")','-Drive','$(echo "$TRIAL_R" | cut -c1)')"
          else
            nohup bash .github/trial/watch.sh "$HOME" > /dev/null 2>&1 < /dev/null &
          fi
          echo "cores $(nproc 2> /dev/null || sysctl -n hw.ncpu)"; date -u
      - name: App toolchain (packages, Rust, Qt, CEF)
        run: bash .github/trial/app-tools.sh
      - uses: actions/download-artifact@v4
        with: { name: "render-ma", path: "${{ env.TRIAL_R }}/dl-render" }
      - uses: actions/download-artifact@v4
        with: { name: "tree-ma", path: "${{ env.TRIAL_R }}/dl-tree" }
      - name: Unpack
        run: |
          t0=$(date +%s)
          cd "$TRIAL_R"
          $PY "$REPO/.github/trial/pack.py" unpack dl-render/render.tar && rm -rf dl-render
          $PY "$REPO/.github/trial/pack.py" unpack dl-tree/tree.tar && rm -rf dl-tree
          echo "TRIAL| unpack | $(( $(date +%s) - t0 )) s"
      - name: Tests ${{ matrix.kind }} ${{ matrix.k }}/${{ matrix.n }}
        run: |
          case "${{ matrix.kind }}" in
            core) sel=(-R '^core\.' -j 3) ;;
            nonui) sel=(-E 'ui-|^core\.' -I "${{ matrix.k }},,${{ matrix.n }}" -j 3) ;;
            ui) sel=(-R 'ui-' -I "${{ matrix.k }},,${{ matrix.n }}" -j 2) ;;
          esac
          t0=$(date +%s)
          ctest --test-dir "$TRIAL_R/b" "${sel[@]}" --timeout 900 --output-on-failure > "$RUNNER_TEMP/ctest.log" 2>&1 || true
          echo "TRIAL| tests ${{ matrix.kind }} ${{ matrix.k }}/${{ matrix.n }} | $(( $(date +%s) - t0 )) s"
          grep -E 'tests passed|Total Test time|\*\*\*Failed|\*\*\*Timeout|Not Run|\*\*\*Exception' "$RUNNER_TEMP/ctest.log" | tail -60 || true
          sed -n '/The following tests FAILED/,$p' "$RUNNER_TEMP/ctest.log" | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "ctest-ma-${{ matrix.kind }}-${{ matrix.k }}", path: "${{ runner.temp }}/ctest.log", retention-days: 3 }
      - name: Peaks
        if: always()
        run: |
          echo "TRIAL| peaks | mem $(cat "$RUNNER_TEMP/trial/mempeak" 2> /dev/null || echo ?) MiB | disk used $(( $(cat "$RUNNER_TEMP/trial/diskpeak" 2> /dev/null || echo 0) / 1024 )) GiB"
          df -h "$TRIAL_R" 2> /dev/null | tail -1 || true
